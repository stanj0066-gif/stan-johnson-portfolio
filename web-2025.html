<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2025 | Stanley Johnson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <span class="site-name">Stanley Johnson</span>
      <nav class="site-nav" aria-label="Main">
        <a href="web-home.html">Home</a>
        <a href="web-jobs.html" aria-current="page">Jobs</a>
        <a href="web-contact.html">Contact</a>
      </nav>
    </header>

    <main>

      <a class="back" href="web-jobs.html"><span aria-hidden="true">←</span> Back to jobs</a>

      <section class="page-title">
        <p class="eyebrow">WHERE I WORKED IN</p>
        <h1>2025</h1>
        <p class="tagline">Building Zone Industries</p>
      </section>

      <div class="tabs" role="tablist" aria-label="Year details">
        <button type="button" class="tab" role="tab" id="tab-photos" aria-controls="panel-photos" aria-selected="true" data-tab="photos">Photos</button>
        <button type="button" class="tab" role="tab" id="tab-info" aria-controls="panel-info" aria-selected="false" data-tab="info">Info</button>
      </div>

      <!-- PHOTOS TAB -->
      <div id="panel-photos" role="tabpanel" aria-labelledby="tab-photos">

        <!-- Replace each src with your photo -->
        <div class="photo-grid">

          <figure class="photo" data-company="buildingzone">
            <img src="imagesbuildingzone-2025-1.jpg" alt="Building Zone Industries job site">
            <span class="photo-company">Building Zone Industries</span>
            <figcaption>[Laredo, Texas]</figcaption>
          </figure>

          <figure class="photo" data-company="buildingzone">
            <img src="imagesbuildingzone-2025-2.jpg" alt="Building Zone Industries job site">
            <span class="photo-company">Building Zone Industries</span>
            <figcaption>[Columbus, Ohio]</figcaption>
          </figure>

          <figure class="photo" data-company="buildingzone">
            <img src="imagesbuildingzone-2025-3.jpg" alt="Building Zone Industries job site">
            <span class="photo-company">Building Zone Industries</span>
            <figcaption>[Columbus, Ohio]</figcaption>
          </figure>

          <figure class="photo" data-company="buildingzone">
            <img src="imagesbuildingzone-2025-4.jpg" alt="Building Zone Industries job site">
            <span class="photo-company">Building Zone Industries</span>
            <figcaption>[Kansas City, Missouri]</figcaption>
          </figure>

        </div>
      </div>

      <!-- INFO TAB -->
      <div id="panel-info" role="tabpanel" aria-labelledby="tab-info" hidden>

        <article class="info-card">
          <h2>Building Zone Industries</h2>
          <dl>
            <dt>Role</dt><dd>[YOUR JOB TITLE]</dd>
            <dt>How long</dt><dd>[HOW LONG YOU WORKED THERE]</dd>
            <dt>Where</dt><dd>[CITY, STATE]</dd>
            <dt>What I did</dt><dd>[A FEW SENTENCES ABOUT THE WORK YOU DID]</dd>
          </dl>
        </article>

      </div>

    </main>
  </div>

  <script src="year.js"></script>
</body>
</html>
